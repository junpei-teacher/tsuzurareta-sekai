<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>綴られた世界 ―余白の森―</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 50% 115%, #183c32 0, transparent 44%),
          linear-gradient(180deg, #050d0c 0%, #081612 55%, #0d211b 100%);
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* ドットを潰さないための最低条件。CSSでの拡大を最近傍にする */
      #screen {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        box-shadow:
          0 0 0 1px #29483d,
          0 18px 56px rgba(0, 0, 0, 0.58),
          0 0 72px rgba(77, 154, 127, 0.08);
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>焚書の夜</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0807;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* ドットを潰さないための最低条件。CSSでの拡大を最近傍にする */
      #screen {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
    </style>
  </head>
  <body>
    <!--
      世界のルールを書き換えてみよう！
      1. damageMultiplier の 1 を 100 に変える。
      2. このファイルを保存し、ブラウザを再読み込みする。
      3. 同じ敵に ROZHA を唱えて、ダメージを比べる。
      infiniteMp は false を true にすると、MPを消費しなくなる。
      元に戻すときは 1 と false に戻して、保存・再読み込み。
    -->
    <script>
      window.GAME_RULES = {
        damageMultiplier: 1, // 呪文のダメージ倍率（1〜1000000）
        infiniteMp: false,  // MP無限：true で有効、false で無効
      };
    </script>
    <canvas id="screen"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
